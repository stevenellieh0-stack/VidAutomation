name: Video Pipeline Runner

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  # Allows you to trigger it manually anytime with a single tap in GitHub
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Video Pipeline
        env:
          GDRIVE_FOLDER_ID: "1nIMpMl1KFMbJl_GA56tU3pFWfYQmT2AM"
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python worker.py
